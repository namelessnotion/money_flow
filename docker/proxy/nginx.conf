events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # One wildcard cert (mkcert-issued if bin/setup_local_ssl.sh has been run,
  # otherwise a self-signed placeholder — see entrypoint.sh) covers all three
  # subdomains.
  ssl_certificate     /etc/nginx/certs/local.namelessnotion.com.pem;
  ssl_certificate_key /etc/nginx/certs/local.namelessnotion.com-key.pem;

  # Plain HTTP always redirects to HTTPS, so Vite's client (client.ts) only
  # ever has one external port (443) to report back to for HMR's websocket
  # — see the fixed clientPort in client/vite.config.ts.
  server {
    listen 80;
    server_name app.local.namelessnotion.com graphql.local.namelessnotion.com rpc.local.namelessnotion.com;
    return 301 https://$host$request_uri;
  }

  # Vite's dev server (client) needs the Upgrade/Connection headers for HMR's
  # websocket; the Ruby and Go backends don't, but sending them is harmless.
  server {
    listen 443 ssl;
    server_name app.local.namelessnotion.com;

    location / {
      proxy_pass http://client:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 443 ssl;
    server_name graphql.local.namelessnotion.com;

    location / {
      proxy_pass http://ruby:9292;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 443 ssl;
    server_name rpc.local.namelessnotion.com;

    location / {
      proxy_pass http://go:8080;
      proxy_set_header Host $host;
    }
  }
}
