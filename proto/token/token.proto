syntax = "proto3";
package money_flow.token;
option go_package = "github.com/namelessnotion/money_flow/go/gen/proto/token";

import "shared/money.proto";

// A Token's balance-affecting activity (debit/credit intent) is recorded on
// the Operation aggregate's event stream, not here — see operation.proto.
// Token only owns its own lifecycle: it is minted into a Wallet with a fixed
// capacity, backed 1:1 by a TigerBeetle account on the shared ledger.

message MintToken {
  string id = 1;
  string wallet_id = 2;
  money_flow.shared.Money capacity = 3;
}

message TokenMinted {
  string id = 1;
  string wallet_id = 2;
  money_flow.shared.Money capacity = 3;
}

message TokenMintRejected {
  string id = 1;
  string wallet_id = 2;
  string reason = 3;
}

message MintTokenResponse {
  string id = 1;
  oneof result {
    TokenMinted token_minted = 2;
    TokenMintRejected token_mint_rejected = 3;
  }
}

service Token {
  rpc Mint(MintToken) returns (MintTokenResponse) {}
}
