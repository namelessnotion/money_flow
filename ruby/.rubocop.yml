plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "bin/tapioca"
    - "gen/proto/**/*"
    - "vendor/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

# Tapioca DSL compilers are declarative: they emit one `create_method` call per
# generated signature. Splitting those lists to satisfy length/ABC metrics makes
# them harder to read, not easier.
Metrics/AbcSize:
  Exclude:
    - "sorbet/tapioca/compilers/**/*.rb"

Metrics/MethodLength:
  Exclude:
    - "sorbet/tapioca/compilers/**/*.rb"

Metrics/ClassLength:
  Exclude:
    - "sorbet/tapioca/compilers/**/*.rb"

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5
